<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#D6E6DF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #121210; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 48px 16px 0; display: flex; justify-content: space-between; align-items: center">
    <a href="Room.dc.html" style="min-height: 44px; min-width: 56px; display: flex; align-items: center; font-size: 15px; font-weight: 600">Done</a>
    <a href="#" style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,0.14); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600">Living Room
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </a>
    <span style="min-width: 56px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 12px; color: #CFCBC2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>On phone
    </span>
  </div>

  <div style="margin-top: 12px; flex: 1; background: #34322D; position: relative; display: flex; align-items: flex-start; justify-content: center">
    <div aria-hidden="true" style="position: absolute; inset: 24px; border: 1px solid rgba(255,255,255,0.18); border-radius: 6px"></div>
    <span style="margin-top: 16px; font-size: 13px; color: #FFFFFF; background: rgba(18,18,16,0.7); padding: 6px 12px; border-radius: 14px">{{ hint }}</span>
  </div>

  <div style="padding: 12px 16px 0; display: flex; gap: 4px; overflow: hidden; height: 44px">
    <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="8">
      <span style="flex-shrink: 0; width: 40px; height: 44px; border-radius: 6px; background: #6A665D"></span>
    </sc-for>
  </div>

  <div style="padding: 14px 24px 8px; display: flex; justify-content: center">
    <button type="button" onClick="{{ shoot }}" aria-label="{{ shutterLabel }}" style="width: 76px; height: 76px; border-radius: 38px; border: 4px solid #FFFFFF; background: transparent; padding: 4px; display: flex; align-items: center; justify-content: center">
      <span style="width: 60px; height: 60px; border-radius: 30px; background: #FFFFFF; display: block"></span>
    </button>
  </div>

  <div role="group" aria-label="What you are photographing" style="margin: 6px 40px 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: rgba(255,255,255,0.1); border-radius: 22px; padding: 4px">
    <button type="button" onClick="{{ toRoom }}" aria-pressed="{{ isRoom }}" style="{{ roomTabStyle }}">Room · {{ roomCount }}</button>
    <button type="button" onClick="{{ toItems }}" aria-pressed="{{ isItems }}" style="{{ itemsTabStyle }}">Items · {{ itemCount }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: 'items', room: 4, items: 23 };
}
renderVals() {
var s = this.state;
var self = this;
var isRoom = s.mode === 'room';
var on = 'height: 38px; border: 0; border-radius: 18px; background: #FFFFFF; color: #121210; font-size: 14px; font-weight: 600';
var off = 'height: 38px; border: 0; border-radius: 18px; background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 500';
var n = isRoom ? s.room : s.items;
var thumbs = [];
for (var i = 0; i < Math.min(n, 9); i++) thumbs.push({ i: i });
return {
isRoom: isRoom,
isItems: !isRoom,
roomTabStyle: isRoom ? on : off,
itemsTabStyle: isRoom ? off : on,
roomCount: s.room,
itemCount: s.items,
thumbs: thumbs,
hint: isRoom ? 'Wide shots of the whole room' : 'Shoot every item. Sort them later.',
shutterLabel: isRoom ? 'Take room photo' : 'Take item photo',
toRoom: function () { self.setState({ mode: 'room' }); },
toItems: function () { self.setState({ mode: 'items' }); },
shoot: function () {
if (isRoom) self.setState({ room: s.room + 1 }); else self.setState({ items: s.items + 1 });
}
};
}
}
</script>
</body>
</html>
