<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Details session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2E5E4E;text-decoration:none}a:hover{color:#1F4337}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #F5F3EE; font-family: Inter, system-ui, sans-serif; color: #1B1A17; overflow: hidden">
  <div style="padding: 48px 24px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Room.dc.html" style="font-size: 15px; font-weight: 500; min-height: 44px; display: flex; align-items: center">Exit</a>
      <span style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 15px; font-weight: 600">Living Room</span><span style="font-size: 12px; color: #5F5B53">Item 1 of 5 needing details</span></span>
      <a href="#" style="font-size: 15px; font-weight: 500; min-height: 44px; display: flex; align-items: center">Skip</a>
    </div>
    <div role="progressbar" aria-label="Details progress" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1" style="height: 6px; border-radius: 3px; background: #E3DFD6; overflow: hidden"><span style="display: block; width: 20%; height: 100%; background: #2E5E4E"></span></div>

    <div style="display: flex; gap: 8px; align-items: center">
      <span style="width: 64px; height: 64px; border-radius: 10px; background: #E7E2D8"></span>
      <span style="width: 64px; height: 64px; border-radius: 10px; background: #E7E2D8"></span>
      <span style="width: 64px; height: 64px; border-radius: 10px; background: #E7E2D8"></span>
      <span style="font-size: 12px; color: #5F5B53; padding-left: 4px">3 photos</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 5px">
      <label for="name" style="font-size: 12px; font-weight: 600; color: #5F5B53">Item name</label>
      <input id="name" type="text" value="Sectional sofa" style="height: 44px; border-radius: 12px; border: 1px solid #E3DFD6; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 16px; color: #1B1A17">
    </div>

    <div style="background: #FFFFFF; border: 1px solid #B9D1C6; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 40px; height: 48px; border-radius: 6px; background: #F1EEE7; border: 1px solid #E3DFD6; display: flex; flex-direction: column; gap: 4px; padding: 7px 6px; box-sizing: border-box">
        <span style="height: 3px; background: #C9C3B6; border-radius: 2px"></span><span style="height: 3px; width: 70%; background: #C9C3B6; border-radius: 2px"></span><span style="height: 3px; background: #C9C3B6; border-radius: 2px"></span>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 600">Receipt scanned</span>
        <span style="font-size: 12px; color: #1F4337">Read on this phone: price, date, store — check them</span>
      </span>
      <a href="#" style="font-size: 13px; font-weight: 600; min-height: 44px; display: flex; align-items: center">+ Another</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px">
      <div style="display: flex; flex-direction: column; gap: 5px"><label for="price" style="font-size: 12px; font-weight: 600; color: #5F5B53">Purchase price</label><input id="price" type="text" inputmode="decimal" value="$1,899.00" style="height: 42px; min-width: 0; border-radius: 10px; border: 1px solid #E3DFD6; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 15px; color: #1B1A17"></div>
      <div style="display: flex; flex-direction: column; gap: 5px"><label for="date" style="font-size: 12px; font-weight: 600; color: #5F5B53">Date purchased</label><input id="date" type="text" value="Mar 14, 2024" style="height: 42px; min-width: 0; border-radius: 10px; border: 1px solid #E3DFD6; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 15px; color: #1B1A17"></div>
      <div style="display: flex; flex-direction: column; gap: 5px"><label for="store" style="font-size: 12px; font-weight: 600; color: #5F5B53">Where purchased</label><input id="store" type="text" value="Crate &amp; Barrel" style="height: 42px; min-width: 0; border-radius: 10px; border: 1px solid #E3DFD6; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 15px; color: #1B1A17"></div>
      <div style="display: flex; flex-direction: column; gap: 5px"><label for="qty" style="font-size: 12px; font-weight: 600; color: #5F5B53">Quantity</label><input id="qty" type="text" inputmode="numeric" value="1" style="height: 42px; min-width: 0; border-radius: 10px; border: 1px solid #E3DFD6; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 15px; color: #1B1A17"></div>
      <div style="display: flex; flex-direction: column; gap: 5px"><label for="brand" style="font-size: 12px; font-weight: 600; color: #5F5B53">Brand</label><input id="brand" type="text" placeholder="Brand" style="height: 42px; min-width: 0; border-radius: 10px; border: 1px solid #E3DFD6; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 15px; color: #1B1A17"></div>
      <div style="display: flex; flex-direction: column; gap: 5px"><label for="serial" style="font-size: 12px; font-weight: 600; color: #5F5B53">Model / serial #</label><input id="serial" type="text" placeholder="If it has one" style="height: 42px; min-width: 0; border-radius: 10px; border: 1px solid #E3DFD6; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 15px; color: #1B1A17"></div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
      <legend style="font-size: 12px; font-weight: 600; color: #5F5B53; padding: 0 0 6px">Condition</legend>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <label style="height: 40px; border-radius: 10px; border: 1px solid #E3DFD6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px"><input type="radio" name="cond" style="accent-color: #2E5E4E; margin: 0">New</label>
        <label style="height: 40px; border-radius: 10px; border: 1px solid #B9D1C6; background: #E3EDE8; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600"><input type="radio" name="cond" checked="checked" style="accent-color: #2E5E4E; margin: 0">Good</label>
        <label style="height: 40px; border-radius: 10px; border: 1px solid #E3DFD6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px"><input type="radio" name="cond" style="accent-color: #2E5E4E; margin: 0">Fair</label>
        <label style="height: 40px; border-radius: 10px; border: 1px solid #E3DFD6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px"><input type="radio" name="cond" style="accent-color: #2E5E4E; margin: 0">Worn</label>
      </div>
    </fieldset>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 30px">
    <a href="Item.dc.html" style="height: 52px; border-radius: 14px; background: #2E5E4E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600">Save &amp; next item
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
